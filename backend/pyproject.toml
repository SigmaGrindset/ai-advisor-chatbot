[project]
name = "travel-advisor"
version = "0.1.0"
description = "AI Travel Advisor — backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "pydantic-settings>=2.11",
    "httpx2>=2.13",
    "openai>=2.2",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
# Loaded as a module, so the package's relative imports resolve.
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
