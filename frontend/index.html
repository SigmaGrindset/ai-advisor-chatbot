<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` runs the canvas under the notch and the rounded
      corners rather than letterboxing the page in white; the shell holds its
      content clear of them with `env(safe-area-inset-*)`.

      `interactive-widget=resizes-content` asks the browser to shrink the
      layout when the virtual keyboard opens, which is what makes `100dvh`
      true on Android; `viewport.ts` is what makes it true everywhere else.

      Nothing here caps the scale. Pinning `maximum-scale` would stop iOS
      zooming a focused input and would also stop the traveler magnifying
      anything on the page, which is not a trade to make: the composer is
      16px, and a 16px field is not zoomed into in the first place.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      The light canvas, which is what the browser draws its own furniture in
      around the page until the application is running. `design/theme.ts`
      rewrites this from the stylesheet once it is, so the colour is named
      once in `tokens.css` and the value here is only what a traveler sees
      before a line of JavaScript has run.
    -->
    <meta name="theme-color" content="#f5f7f2" />
    <meta name="description" content="Plan a trip by talking about one." />

    <!--
      The theme, before the first paint.

      Everything about how this application looks hangs off one attribute on
      `<html>` (`design/tokens.css`), and React cannot set it soon enough: a
      traveler who chose dark would watch the page load white and turn over,
      which is a flash of precisely the thing they said they did not want.
      So the attribute is settled here, in the head, before the browser has
      drawn anything — and `design/theme.ts` takes it from here.

      The key and the attribute are named in that module too. Two places
      naming one string can drift apart, so `theme.test.ts` reads this file
      and checks that they have not. The rule is the module's own: anything
      stored that is not `light` or `dark` — `system`, nothing at all, or a
      leftover from a version of this application that no longer exists —
      means follow the machine.

      It is allowed to fail. A browser told to keep no site data throws on
      the mere act of reaching for `localStorage`, and a theme is not worth a
      blank page: the catch leaves the attribute unset, which is the light
      theme, which is where this application started.
    -->
    <script>
      try {
        var asked = localStorage.getItem("travel-advisor.theme");
        var dark =
          asked === "dark" ||
          (asked !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (unavailable) {
        /* The light theme, then. */
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads no manifest, and rounds this one's corners itself. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <title>AI Travel Advisor</title>

    <!--
      What this application looks like when its address is pasted somewhere
      else. Without these a link to it unfurls as a bare hostname, which is
      the one thing a traveler sending themselves the address will see before
      they open it.

      The image is the application's own icon, already in `public/` and
      already being shipped, rather than a rendering of the interface: a
      preview card is a small square next to a line of text, and a screenshot
      of a three-pane layout at that size is a grey rectangle.

      `og:url` is deliberately absent. It is an absolute address, and this
      application is served from wherever it is run — a hostname written into
      the markup at build time would be wrong for every deployment except the
      one it was written for, and a wrong `og:url` is worse than none.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Travel Advisor" />
    <meta
      property="og:description"
      content="Plan a trip by talking about one. The advisor looks things up rather than guessing, and the plan takes shape beside the conversation."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
